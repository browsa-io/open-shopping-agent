# Publishes npm `open-shopping-agent` with a provenance statement, through npm trusted publishing
# (OIDC, no NPM_TOKEN secret), then creates the GitHub Release for the tag with that version's
# notes from CHANGELOG.md. The Release is created with the workflow's own token, so its author is
# github-actions[bot], never a person's account.
#
# Trigger: push a tag v<version> (for example v0.2.1) whose version equals package.json.
#
# One-time setup on npmjs.com (package `open-shopping-agent` > Settings > Trusted Publisher >
# GitHub Actions):
#   Organization or user:  browsa-io
#   Repository:            open-shopping-agent
#   Workflow filename:     publish.yml
#   Environment name:      (leave empty)
# Until that form is saved, the first step below stops the run with these values and nothing is
# built or published. Trusted publishing needs npm 11.5.1 or later and Node 22.14.0 or later
# (https://docs.npmjs.com/trusted-publishers).

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Mints the OIDC token npm exchanges for a publish credential and signs provenance with.
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Check the tag, the version and the changelog (before anything is built)
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error title=Tag and version differ::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}. Tag the commit whose package.json says the version you mean to publish."
            exit 1
          fi
          if [ "$(node -p "require('./server.json').version")" != "${version}" ]; then
            echo "::error title=server.json version differs::server.json does not say ${version}."
            exit 1
          fi
          if npm view "open-shopping-agent@${version}" version >/dev/null 2>&1; then
            echo "::error title=Already published::open-shopping-agent@${version} is already on npm. Bump the version; a published version cannot be replaced."
            exit 1
          fi
          node scripts/release-notes.mjs "${version}" > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check that npm trusts this workflow (fails fast when the trusted publisher is not set up)
        run: |
          # The same exchange `npm publish` does: a GitHub OIDC token for audience npm:registry.npmjs.org
          # is swapped for a short-lived publish credential. The credential is not kept or printed.
          how='On npmjs.com open the package open-shopping-agent > Settings > Trusted Publisher > GitHub Actions and save: Organization or user "browsa-io", Repository "open-shopping-agent", Workflow filename "publish.yml", Environment name empty. Then run this workflow again (re-run the failed job, or delete and push the tag again).'
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error title=No OIDC token::This job has no id-token permission, so npm trusted publishing cannot work. Keep 'id-token: write' on the publish job."
            exit 1
          fi
          id_token="$(curl -sS --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).value')"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${id_token}" -H 'Content-Type: application/json' 'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/open-shopping-agent' || echo 000)"
          case "$code" in
            2*) echo "npm trusts this workflow for open-shopping-agent." ;;
            4*)
              echo "::error title=npm trusted publisher is not configured::npm refused this workflow (HTTP ${code}). ${how}"
              { echo "## Not published"; echo ""; echo "npm does not trust this workflow yet (HTTP ${code}). ${how}"; } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            *) echo "::warning title=Could not check the trusted publisher::npm answered HTTP ${code} to the check; going on. If the publish step fails with an authentication error: ${how}" ;;
          esac

      - name: Use npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Build, type-check and test
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Check the package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const need = ["dist/cli/index.js", "dist/index.js", "dist/index.d.ts", "dist/version.js", "CHANGELOG.md"];
            const missing = need.filter((f) => !files.includes(f));
            if (missing.length) { console.error("Missing from the package:", missing); process.exit(1); }
            console.log("Package holds", files.length, "files.");
          '
          rm pack.json

      - name: Publish
        # No token: npm exchanges the GitHub OIDC token for a short-lived publish credential.
        # prepublishOnly builds and tests once more.
        run: |
          if ! npm publish --provenance --access public; then
            echo "::error title=npm publish failed::If the error above is about authentication (ENEEDAUTH, 401, 403, 404 on PUT), the npm trusted publisher is not set up for this workflow: package open-shopping-agent > Settings > Trusted Publisher > GitHub Actions, Organization browsa-io, Repository open-shopping-agent, Workflow filename publish.yml, no environment."
            exit 1
          fi
          echo "Published open-shopping-agent@${{ steps.version.outputs.version }} with provenance." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release with the version's notes
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: "Create the Release (author: github-actions[bot])"
        env:
          # The workflow's own token: the Release is authored by the Actions bot.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --title "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
          fi
