# Creates or updates the GitHub Release of a tag that already exists, with that version's notes
# from CHANGELOG.md. It publishes nothing to npm. Use it for versions that were published before
# the publish workflow existed (v0.1.0, v0.1.1, v0.2.0), or to fix a Release's notes.
# The Release is created with the workflow's own token, so its author is github-actions[bot].

name: Release notes for an existing tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version whose tag already exists, for example 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release for v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch: it has the full CHANGELOG.md, also for versions tagged on older commits.
      - uses: actions/checkout@v4
      - name: "Create or update the Release (author: github-actions[bot])"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          case "$VERSION" in
            *[!0-9A-Za-z.-]*|"") echo "::error::\"$VERSION\" is not a version"; exit 1 ;;
          esac
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error title=No such tag::Tag v$VERSION does not exist. Push the tag first; this workflow never creates tags."
            exit 1
          fi
          node scripts/release-notes.mjs "$VERSION" > notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --title "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
          fi
