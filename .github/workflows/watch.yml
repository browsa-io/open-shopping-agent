name: watch

# Price and stock watches on a schedule, for forks. Off until you set the repository variable
# OSA_WATCHES to "on". Commit your .osa/watches.json (git add -f), add BROWSA_API_KEY and your
# alert settings as secrets. Each pass checks the watches that are due and commits the history.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    if: vars.OSA_WATCHES == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSA_API_KEY: ${{ secrets.BROWSA_API_KEY }}
      OSA_SLACK_WEBHOOK_URL: ${{ secrets.OSA_SLACK_WEBHOOK_URL }}
      OSA_WEBHOOK_URL: ${{ secrets.OSA_WEBHOOK_URL }}
      OSA_WEBHOOK_SECRET: ${{ secrets.OSA_WEBHOOK_SECRET }}
      OSA_EMAIL_TO: ${{ secrets.OSA_EMAIL_TO }}
      OSA_EMAIL_FROM: ${{ secrets.OSA_EMAIL_FROM }}
      OSA_SMTP_HOST: ${{ secrets.OSA_SMTP_HOST }}
      OSA_SMTP_PORT: ${{ secrets.OSA_SMTP_PORT }}
      OSA_SMTP_USER: ${{ secrets.OSA_SMTP_USER }}
      OSA_SMTP_PASS: ${{ secrets.OSA_SMTP_PASS }}
      OSA_SMTP_FROM: ${{ secrets.OSA_SMTP_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check due watches
        run: node dist/cli/index.js watch run --once
      - name: Commit history
        if: always()
        run: |
          git config user.name "Browsa"
          git config user.email "support@browsa.io"
          git add -f .osa/watches.json .osa/watches 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "watch: history $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
