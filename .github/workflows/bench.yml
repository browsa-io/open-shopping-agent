name: bench

# Daily success rates per store. Runs the fixed tasks in bench/tasks.json on Phantom browsers,
# writes bench/results/<date>.json and updates the table in README.md. Never places an order.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      stores:
        description: "Stores to run, comma separated (empty = all)"
        required: false
        default: ""
      max_credits:
        description: "Credit cap for the run"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BROWSA_API_KEY: ${{ secrets.BROWSA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run the bench
        if: env.BROWSA_API_KEY != ''
        env:
          STORES: ${{ github.event.inputs.stores }}
          MAX_CREDITS: ${{ github.event.inputs.max_credits || '40' }}
        run: |
          args="--max-credits $MAX_CREDITS"
          if [ -n "$STORES" ]; then args="$args --stores $STORES"; fi
          npm run bench -- $args
      - name: No key
        if: env.BROWSA_API_KEY == ''
        run: echo "Set the BROWSA_API_KEY repository secret to run the bench." && npm run bench -- --dry-run
      - name: Commit results
        if: env.BROWSA_API_KEY != ''
        run: |
          git config user.name "Browsa"
          git config user.email "support@browsa.io"
          git add bench/results README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "bench: results $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
